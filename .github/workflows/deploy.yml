name: Build Astro and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install site dependencies
        run: bun install --frozen-lockfile
        working-directory: site
      - name: Test publication rules
        run: bun run test
        working-directory: site
      - name: Test local article rendering
        run: bun run test:render
        working-directory: site
      - name: Build public site
        run: bun run build
        working-directory: site
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site/dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/
            CNAME
          single-commit: true
